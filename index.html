<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supercar Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Welcome to the Tycoons-Supercar Showcase</h1>
    <p>Experience the thrill of the world's most exotic and powerful vehicles. From the sleek curves of Italian design to the raw power of American muscle, supercars represent the pinnacle of automotive engineering.</p>

    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1705458003264-c3c097d68217?q=80&w=1527&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Ford raptor f150" />
      <img src="https://images.unsplash.com/photo-1621688285733-07fad23b81c7?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Lamborghini Aventador" />
      <img src="https://images.unsplash.com/photo-1566024164372-0281f1133aa6?q=80&w=1364&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="McLaren 720S" />
    </div>

    <div class="preferences">
      <input type="text" id="username" placeholder="Enter your name" />
      <button id="saveBtn">Save Name</button>
      <button id="animateBtn">Animate Box</button>
      <button id="toggleThemeBtn">Toggle Theme</button>
    </div>

    <div class="box" id="box"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
